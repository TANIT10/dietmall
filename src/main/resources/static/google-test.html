<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>DietMall Google Login Test</title>

    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

    <h1>DietMall 구글 로그인 테스트</h1>

    <div id="googleButton"></div>

    <pre id="result"></pre>


    <script>
        window.onload = function () {

            google.accounts.id.initialize({
                client_id: "903211815491-4rrh5fbsperto2aqmmit56f725k3usvb.apps.googleusercontent.com",
                callback: handleCredentialResponse
            });

            google.accounts.id.renderButton(
                document.getElementById("googleButton"),
                {
                    theme: "outline",
                    size: "large",
                    text: "signin_with"
                }
            );
        };


        function handleCredentialResponse(response) {

            document.getElementById("result").textContent =
                "구글 로그인 성공! DietMall 서버로 로그인 요청 중...";

            fetch("/api/auth/google/login", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    idToken: response.credential
                })
            })

            .then(response => {
                if (!response.ok) {
                    throw new Error(
                        "DietMall 로그인 실패: HTTP " + response.status
                    );
                }

                return response.json();
            })

            .then(data => {

                document.getElementById("result").textContent =
                    JSON.stringify(data, null, 2);
            })

            .catch(error => {

                document.getElementById("result").textContent =
                    error.message;
            });
        }
    </script>

</body>
</html>
