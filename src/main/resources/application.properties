spring.application.name=dietmall

# JWT
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration=3600000
jwt.refresh-token-expiration=1209600000

# DietMall AI service
ai.service.base-url=${AI_SERVICE_BASE_URL:http://127.0.0.1:8000}
ai.service.connect-timeout=${AI_SERVICE_CONNECT_TIMEOUT:3s}
ai.service.read-timeout=${AI_SERVICE_READ_TIMEOUT:10s}
ai.service.api-key=${AI_SERVICE_API_KEY:}